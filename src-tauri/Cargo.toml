[package]
name = "sugarplayer"
version = "0.1.1"
description = "A simple local music player (Tauri)"
authors = ["SugarPlayer"]
edition = "2021"

[lib]
name = "sugarplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
base64 = "0.22.1"
walkdir = "2"
tiny_http = "0.12"
notify = "6"
dirs = "5"

[profile.release]
opt-level = 2
